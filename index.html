<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firstlight — Faith &amp; Growth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#23283A;
    --ink-soft:#4B5169;
    --paper:#F8F7F3;
    --card-bg:#FFFFFF;
    --paper-dim:#F1EEE6;
    --line:#E4E0D6;
    --gold:#B8912F;
    --gold-soft:#EADFC2;
    --dusk:#5C6699;
    --sky:#4FA9E8;
    --sky-dark:#2F8BCB;
    --sky-soft:#EAF5FC;
    --radius:20px;
    --shadow: 0 1px 2px rgba(35,40,58,0.04), 0 8px 24px rgba(35,40,58,0.06);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  #app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    position:relative;
    background:
      radial-gradient(ellipse 640px 260px at 50% 150px, rgba(184,145,47,0.09), transparent 72%),
      var(--paper);
  }

  /* header */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:22px 22px 0 22px;
    position:relative;
    z-index:20;
  }

  .header-right{display:flex; align-items:center; gap:10px;}

  .menu-wrap{position:relative;}

  .menu-btn{
    width:34px;height:34px;
    flex:none;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--card-bg);
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    transition:border-color .2s ease, background .2s ease;
  }
  .menu-btn span{
    display:block;
    width:15px; height:2px;
    background:var(--ink-soft);
    border-radius:2px;
    transition:background .2s ease;
  }
  .menu-btn:hover{border-color:var(--gold);}
  .menu-btn:hover span{background:var(--ink);}
  .menu-btn:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  .menu-dropdown{
    position:absolute;
    top:calc(100% + 8px);
    left:0;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:var(--shadow);
    overflow:hidden;
    min-width:210px;
    opacity:0;
    transform:translateY(-6px);
    pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
    z-index:30;
  }
  .menu-dropdown.open{opacity:1; transform:translateY(0); pointer-events:auto;}
  .menu-option{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    border-bottom:1px solid var(--line);
    padding:13px 18px;
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:14px;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .menu-option:last-child{border-bottom:none;}
  .menu-option:hover{background:var(--paper-dim); color:var(--ink);}
  .menu-option:focus-visible{outline:2px solid var(--gold); outline-offset:-2px;}

  .give-btn{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.03em;
    color:var(--gold-soft);
    background:var(--ink);
    border:1px solid rgba(184,145,47,0.55);
    border-radius:14px;
    padding:9px 20px;
    cursor:pointer;
    box-shadow:0 0 0 rgba(184,145,47,0), 0 4px 16px rgba(184,145,47,0.32);
    transition:background .18s ease, transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .give-btn:hover{background:#1B1F2E; border-color:var(--gold); transform:translateY(-1px); box-shadow:0 0 18px rgba(184,145,47,0.45), 0 4px 16px rgba(184,145,47,0.3);}
  .give-btn:active{transform:translateY(0);}
  .give-btn:focus-visible{outline:2px solid var(--gold); outline-offset:3px;}

  .lang-wrap{position:relative;}

  .lang-btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:999px;
    padding:8px 16px;
    cursor:pointer;
    transition:border-color .2s ease, color .2s ease, background .2s ease;
  }
  .lang-btn:hover{border-color:var(--gold); color:var(--ink);}
  .lang-btn:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  .lang-menu{
    position:absolute;
    top:calc(100% + 8px);
    right:0;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:var(--shadow);
    overflow:hidden;
    min-width:104px;
    opacity:0;
    transform:translateY(-6px);
    pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
  }
  .lang-menu.open{opacity:1; transform:translateY(0); pointer-events:auto;}
  .lang-option{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    padding:10px 16px;
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:13px;
    letter-spacing:0.06em;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .lang-option:hover{background:var(--paper-dim); color:var(--ink);}
  .lang-option[aria-current="true"]{color:var(--gold); font-weight:600;}

  /* home screen */
  main{padding:0 22px 60px 22px;}

  .greeting{
    text-align:center;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:12px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--gold);
    margin:40px 0 16px 0;
    opacity:0;
    animation:riseIn .6s ease forwards;
  }

  .question{
    text-align:center;
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:clamp(30px, 8vw, 42px);
    line-height:1.22;
    letter-spacing:-0.015em;
    color:var(--ink);
    margin:0 0 16px 0;
    white-space:pre-line;
    opacity:0;
    animation:riseIn .6s ease .08s forwards;
  }

  .subtext{
    text-align:center;
    font-family:'Inter',sans-serif;
    font-size:15px;
    line-height:1.6;
    color:var(--ink-soft);
    margin:0 0 40px 0;
    white-space:pre-line;
    opacity:0;
    animation:riseIn .6s ease .14s forwards;
  }

  @keyframes riseIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }

  .cards{display:flex; flex-direction:column; gap:14px;}

  .card{
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    width:100%;
    text-align:left;
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 24px;
    cursor:pointer;
    font-family:inherit;
    transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    opacity:0;
    animation:riseIn .32s ease forwards;
  }
  .card:hover{border-color:rgba(var(--accent-rgb,184,145,47),0.5); box-shadow:var(--shadow); transform:translateY(-3px);}
  .card:active{transform:translateY(-1px) scale(1.01);}
  .card:focus-visible{outline:2px solid var(--gold); outline-offset:3px;}

  .card-glow{
    position:absolute;
    top:-50%;
    right:-16%;
    width:130px;
    height:130px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(var(--accent-rgb,184,145,47),0.20) 0%, rgba(var(--accent-rgb,184,145,47),0) 70%);
    pointer-events:none;
  }

  .card-title{
    position:relative;
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:19px;
    color:var(--ink);
  }
  .card-arrow{
    position:relative;
    flex:none;
    width:34px; height:34px;
    border-radius:50%;
    background:rgba(var(--accent-rgb,184,145,47),0.14);
    color:var(--accent,var(--gold));
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    transition:background .16s ease, color .16s ease, transform .16s ease;
  }
  .card:hover .card-arrow{background:var(--accent,var(--gold)); color:#fff; transform:translateX(2px);}

  /* hero card */
  .card--hero{padding:28px 26px; align-items:flex-end;}
  .card-body{position:relative; display:flex; flex-direction:column; gap:6px;}
  .card-title--hero{font-size:25px;}
  .card-cta{
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:14px;
    color:var(--ink-soft);
  }
  .card-arrow--hero{width:40px; height:40px; font-size:17px;}
  .card--hero .card-glow{width:190px; height:190px; top:-55%; right:-18%;}

  /* mini grid cards */
  .cards-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .card--mini{
    flex-direction:column;
    align-items:flex-start;
    justify-content:space-between;
    padding:18px 16px;
    gap:22px;
    min-height:96px;
  }
  .card-title--mini{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--ink);
  }
  .card-arrow--mini{width:28px; height:28px; font-size:14px; align-self:flex-end;}
  .card--mini .card-glow{width:80px; height:80px; top:-40%; right:-20%;}

  .cards-list{display:flex; flex-direction:column; gap:12px;}

  /* detail screen */
  .detail{
    padding:0 22px 60px 22px;
    display:none;
  }
  .detail.visible{display:block;}
  #home.hidden{display:none;}

  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:none;
    border:none;
    color:var(--ink-soft);
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:14px;
    padding:0;
    margin:34px 0 30px 0;
    cursor:pointer;
  }
  .back-btn:hover{color:var(--ink);}
  .back-btn:focus-visible{outline:2px solid var(--gold); outline-offset:4px;}

  .detail-eyebrow{
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:600;
    margin-bottom:10px;
  }

  .detail-title{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:clamp(28px,7vw,38px);
    line-height:1.15;
    margin:0 0 22px 0;
    color:var(--ink);
  }

  .detail-text{
    font-size:16px;
    line-height:1.7;
    color:var(--ink-soft);
    margin:0 0 30px 0;
    white-space:pre-line;
  }

  .verse{
    border-left:2px solid var(--gold-soft);
    padding:2px 0 2px 18px;
    margin:0 0 34px 0;
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:17px;
    color:var(--dusk);
    line-height:1.6;
  }

  .yt-btn[hidden]{display:none;}
  .yt-btn{
    display:inline-flex;
    align-items:center;
    gap:12px;
    background:var(--ink);
    color:var(--paper);
    text-decoration:none;
    padding:16px 24px;
    border-radius:999px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    transition:background .18s ease, transform .18s ease;
  }
  .yt-btn:hover{background:var(--gold); transform:translateY(-1px);}
  .yt-btn:focus-visible{outline:2px solid var(--gold); outline-offset:3px;}
  .yt-icon{
    width:22px;height:22px;
    flex:none;
    display:flex;align-items:center;justify-content:center;
    background:#fff;
    border-radius:5px;
  }
  .yt-icon svg{width:12px;height:12px;}
  .yt-btn.generic-action .yt-icon{display:none;}

  .study-block[hidden]{display:none;}
  .study-block{margin-top:8px;}

  .study-note{
    font-size:15px;
    line-height:1.7;
    color:var(--ink-soft);
    background:var(--paper-dim);
    border-left:2px solid var(--sky);
    padding:14px 18px;
    border-radius:0 12px 12px 0;
    margin:0 0 20px 0;
  }

  .video-links{display:flex; flex-direction:column; gap:10px; margin:0 0 24px 0;}
  .video-link-btn{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--ink);
    color:var(--paper);
    text-decoration:none;
    padding:16px 24px;
    border-radius:999px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    transition:background .18s ease, transform .18s ease;
  }
  .video-link-btn:hover{background:var(--gold); transform:translateY(-1px);}
  .video-link-btn:focus-visible{outline:2px solid var(--gold); outline-offset:3px;}
  .video-link-btn .yt-icon{
    width:22px;height:22px;
    flex:none;
    display:flex;align-items:center;justify-content:center;
    background:#fff;
    border-radius:5px;
  }
  .video-link-btn .yt-icon svg{width:12px;height:12px;}

  .blessing-text{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:17px;
    line-height:1.6;
    color:var(--dusk);
    border-left:2px solid var(--gold-soft);
    padding:2px 0 2px 18px;
    margin:0 0 24px 0;
  }

  .quiz-btn{
    background:var(--sky);
    color:#fff;
    border:none;
    border-radius:14px;
    padding:16px 24px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:background .18s ease, transform .18s ease;
  }
  .quiz-btn:hover{background:var(--sky-dark); transform:translateY(-1px);}
  .quiz-btn:focus-visible{outline:2px solid var(--sky-dark); outline-offset:3px;}

  footer.brand{
    text-align:center;
    padding:30px 22px 44px 22px;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:#9CA0B4;
  }

  /* give modal */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(35,40,58,0.45);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    z-index:200;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .modal-overlay.open{opacity:1; pointer-events:auto;}

  .modal{
    background:var(--paper);
    width:100%;
    max-width:560px;
    max-height:88vh;
    border-radius:24px 24px 0 0;
    overflow-y:auto;
    transform:translateY(24px);
    transition:transform .3s ease;
    box-shadow:0 -8px 40px rgba(35,40,58,0.25);
  }
  .modal-overlay.open .modal{transform:translateY(0);}

  .modal-header{
    position:sticky;
    top:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 18px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    z-index:2;
  }
  .modal-title{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:19px;
    margin:0;
    color:var(--ink);
    text-align:center;
    flex:1;
  }
  .modal-back, .modal-close{
    background:none;
    border:none;
    cursor:pointer;
    flex:none;
    width:32px;height:32px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);
    font-size:18px;
    transition:background .15s ease, color .15s ease;
  }
  .modal-back:hover, .modal-close:hover{background:var(--paper-dim); color:var(--ink);}
  .modal-back:focus-visible, .modal-close:focus-visible{outline:2px solid var(--sky); outline-offset:2px;}
  .modal-back.invisible{visibility:hidden;}

  .modal-body{padding:22px 20px 34px 20px;}

  .give-step[hidden]{display:none;}
  .give-step-center{display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px; padding:26px 10px;}

  .modal-subtitle{font-size:14px; color:var(--ink-soft); margin:0 0 18px 0;}

  .give-type-grid{display:flex; flex-direction:column; gap:10px; margin-bottom:18px;}
  .give-type-btn{
    display:flex; align-items:center; justify-content:space-between;
    width:100%; text-align:left;
    background:var(--paper-dim);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 18px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .18s ease, background .18s ease;
  }
  .give-type-btn:hover{border-color:var(--sky);}
  .give-type-btn.selected{border-color:var(--sky); background:var(--sky-soft);}
  .give-type-btn:focus-visible{outline:2px solid var(--sky); outline-offset:2px;}

  .project-field[hidden]{display:none;}
  .project-field{display:flex; flex-direction:column; gap:6px; margin:2px 0 18px 0;}
  .project-field label{font-size:13px; font-weight:600; color:var(--ink-soft);}
  .project-field input{
    font-family:'Inter',sans-serif;
    font-size:15px;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    outline:none;
    width:100%;
    transition:border-color .18s ease;
  }
  .project-field input:focus{border-color:var(--sky);}
  .form-field{display:flex; flex-direction:column; gap:6px; margin-bottom:16px;}
  .form-row{display:flex; gap:12px;}
  .form-row .form-field{flex:1;}
  .form-field label{font-size:13px; font-weight:600; color:var(--ink-soft);}
  .form-field input{
    font-family:'Inter',sans-serif;
    font-size:15px;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    outline:none;
    width:100%;
    transition:border-color .18s ease;
  }
  .form-field input:focus{border-color:var(--sky);}

  .form-error{color:#C24545; font-size:13px; margin:-6px 0 14px 0;}
  .form-error[hidden]{display:none;}

  .payment-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
  .payment-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--paper-dim);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 10px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .18s ease, background .18s ease;
  }
  .payment-btn:hover{border-color:var(--sky);}
  .payment-btn.selected{border-color:var(--sky); background:var(--sky-soft);}
  .payment-btn:focus-visible{outline:2px solid var(--sky); outline-offset:2px;}

  .card-fields[hidden]{display:none;}
  .card-fields{margin:4px 0 18px 0;}

  .modal-primary-btn{
    width:100%;
    background:var(--sky);
    color:#fff;
    border:none;
    border-radius:14px;
    padding:16px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:background .18s ease, opacity .18s ease;
  }
  .modal-primary-btn:hover:not(:disabled){background:var(--sky-dark);}
  .modal-primary-btn:disabled{opacity:0.45; cursor:not-allowed;}
  .modal-primary-btn:focus-visible{outline:2px solid var(--sky-dark); outline-offset:3px;}

  .spinner{
    width:44px;height:44px;
    border:4px solid var(--paper-dim);
    border-top-color:var(--sky);
    border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .success-check{
    width:64px;height:64px;
    border-radius:50%;
    background:#E4F5E8;
    color:#3C9A5C;
    display:flex; align-items:center; justify-content:center;
    font-size:30px;
  }
  .give-step-center h3{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:22px;
    margin:0;
    color:var(--ink);
  }
  .give-step-center p{
    font-size:15px;
    line-height:1.6;
    color:var(--ink-soft);
    margin:0 0 8px 0;
  }
  .give-step-center .modal-primary-btn{margin-top:8px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="menu-wrap">
      <button class="menu-btn" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="menu-dropdown" id="menuDropdown" role="menu">
        <button class="menu-option" data-menu="0" role="menuitem"></button>
        <button class="menu-option" data-menu="1" role="menuitem"></button>
        <button class="menu-option" data-menu="2" role="menuitem"></button>
        <button class="menu-option" data-menu="3" role="menuitem"></button>
      </div>
    </div>
    <div class="header-right">
      <button class="give-btn" id="giveBtn">Give</button>

function youtubeSearchUrl(query){
  return "https://www.youtube.com/results?search_query=" + encodeURIComponent(query);
}

const CARD_ACCENTS = ['#C9A227','#8B7AA8','#4FA9E8','#7C9473','#D98B4A','#4E9A78','#6C7FD6','#C17B98','#C2703D'];

function accentRgb(hex){
  const h = hex.replace('#','');
  const num = parseInt(h,16);
  return [(num>>16)&255,(num>>8)&255,num&255].join(',');
}

function applyAccent(el, index){
  const color = CARD_ACCENTS[index % CARD_ACCENTS.length];
  el.style.setProperty('--accent', color);
  el.style.setProperty('--accent-rgb', accentRgb(color));
}

function renderHome(){
  const t = translations[currentLang];
  els.greeting.textContent = t.greeting;
  els.question.textContent = t.question;
  els.subtext.textContent = t.subtext || '';
  els.tBack.textContent = t.back;
  els.footer.textContent = t.footer;
  els.langBtn.textContent = currentLang.toUpperCase();

  els.cardsWrap.innerHTML = '';

  if(t.cards.length){
    const hero = document.createElement('button');
    hero.className = 'card card--hero';
    applyAccent(hero, 0);
    hero.style.animationDelay = '0.12s';
    hero.innerHTML =
      '<span class="card-glow" aria-hidden="true"></span>' +
      '<span class="card-body">' +
        '<span class="card-title card-title--hero"></span>' +
        '<span class="card-cta"></span>' +
      '</span>' +
      '<span class="card-arrow card-arrow--hero" aria-hidden="true">→</span>';
    const heroCard = t.cards[0];
    hero.querySelector('.card-title--hero').textContent = heroCard.label || heroCard.title;
    hero.querySelector('.card-cta').textContent = heroCard.cta || '';
    hero.addEventListener('click', () => openDetail(0));
    els.cardsWrap.appendChild(hero);
  }

  const gridIndices = [1,2,3,4].filter(i => t.cards[i]);
  if(gridIndices.length){
    const grid = document.createElement('div');
    grid.className = 'cards-grid';
    gridIndices.forEach((idx, gi) => {
      const card = t.cards[idx];
      const btn = document.createElement('button');
      btn.className = 'card card--mini';
      applyAccent(btn, idx);
      btn.style.animationDelay = (0.17 + gi * 0.035) + 's';
      btn.innerHTML =
        '<span class="card-glow" aria-hidden="true"></span>' +
        '<span class="card-title card-title--mini"></span>' +
        '<span class="card-arrow card-arrow--mini" aria-hidden="true">→</span>';
      btn.querySelector('.card-title--mini').textContent = card.label || card.title;
      btn.addEventListener('click', () => openDetail(idx));
      grid.appendChild(btn);
    });
    els.cardsWrap.appendChild(grid);
  }

  const restIndices = t.cards.map((_, i) => i).filter(i => i >= 5);
  if(restIndices.length){
    const list = document.createElement('div');
    list.className = 'cards-list';
    restIndices.forEach((idx, ri) => {
      const card = t.cards[idx];
      const btn = document.createElement('button');
      btn.className = 'card';
      applyAccent(btn, idx);
      btn.style.animationDelay = (0.32 + ri * 0.03) + 's';
      btn.innerHTML =
        '<span class="card-glow" aria-hidden="true"></span>' +
        '<span class="card-title"></span>' +
        '<span class="card-arrow" aria-hidden="true">→</span>';
      btn.querySelector('.card-title').textContent = card.title;
      btn.addEventListener('click', () => openDetail(idx));
      list.appendChild(btn);
    });
    els.cardsWrap.appendChild(list);
  }

  els.menuBtn.setAttribute('aria-label', t.menuAria);
  document.querySelectorAll('.menu-option').forEach(opt => {
    opt.textContent = t.menuItems[Number(opt.dataset.menu)].title;
  });
}

function actionHref(action){
  if(!action) return '#';
  if(action.type === 'tel') return 'tel:' + action.value;
  if(action.type === 'mailto') return 'mailto:' + action.value;
  if(action.type === 'maps') return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(action.value);
  return action.value || '#';
}

function renderDetail(){
  const t = translations[currentLang];

  if(currentMenuIndex !== null){
    const item = t.menuItems[currentMenuIndex];
    els.dEyebrow.textContent = item.eyebrow;
    els.dTitle.textContent = item.title;
    els.dText.textContent = item.text;
    els.dVerse.hidden = true;
    els.dStudyBlock.hidden = true;
    els.dYt.classList.add('generic-action');
    if(item.action){
      els.dYt.hidden = false;
      els.dYt.href = actionHref(item.action);
      els.dYt.target = item.action.type === 'maps' ? '_blank' : '_self';
      els.dYtLabel.textContent = item.action.label;
    } else {
      els.dYt.hidden = true;
    }
    return;
  }

  if(currentCardIndex === null) return;
  const card = t.cards[currentCardIndex];
  els.dEyebrow.textContent = card.eyebrow;
  els.dTitle.textContent = card.title;
  els.dText.textContent = card.text;
  els.dVerse.textContent = card.verse;
  els.dVerse.hidden = false;
  els.dYt.classList.remove('generic-action');

  if(card.videos){
    els.dYt.hidden = true;
    els.dStudyBlock.hidden = false;
    els.dStudyNote.textContent = card.studyNote;
    els.dBlessing.textContent = card.blessing;
    els.dQuizBtn.textContent = card.quizLabel;
    els.dVideoLinks.innerHTML = '';
    card.videos.forEach(video => {
      const a = document.createElement('a');
      a.className = 'video-link-btn';
      a.href = video.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.innerHTML = '<span class="yt-icon"><svg viewBox="0 0 24 24" fill="#23283A"><path d="M21.6 7.2s-.2-1.5-.8-2.2c-.8-.9-1.7-.9-2.1-1C15.9 3.8 12 3.8 12 3.8h0s-3.9 0-6.7.2c-.4 0-1.3.1-2.1 1-.6.7-.8 2.2-.8 2.2S2.2 9 2.2 10.8v1.4c0 1.8.2 3.6.2 3.6s.2 1.5.8 2.2c.8.9 1.9.9 2.4 1 1.7.2 7.4.2 7.4.2s3.9 0 6.7-.2c.4 0 1.3-.1 2.1-1 .6-.7.8-2.2.8-2.2s.2-1.8.2-3.6v-1.4c0-1.8-.2-3.6-.2-3.6zM9.9 14.6V8.6l5.4 3-5.4 3z"/></svg></span><span></span>';
      a.querySelector('span:last-child').textContent = video.label;
      els.dVideoLinks.appendChild(a);
    });
  } else {
    els.dStudyBlock.hidden = true;
    els.dYt.hidden = false;
    els.dYt.target = '_blank';
    els.dYt.href = youtubeSearchUrl(card.search);
    els.dYtLabel.textContent = t.watch;
  }
}

function openQuiz(){
  const t = translations[currentLang];
  if(currentCardIndex === null) return;
  const card = t.cards[currentCardIndex];
  els.quizModalTitle.textContent = card.quizTitle;
  els.quizPlaceholderText.textContent = card.quizPlaceholder;
  els.quizOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeQuiz(){
  els.quizOverlay.classList.remove('open');
  document.body.style.overflow = '';
}

function openDetail(index){
  currentCardIndex = index;
  currentMenuIndex = null;
  renderDetail();
  els.home.classList.add('hidden');
  els.detail.classList.add('visible');
  window.scrollTo({top:0, behavior:'smooth'});
}

function openMenuItem(index){
  currentMenuIndex = index;
  currentCardIndex = null;
  renderDetail();
  els.home.classList.add('hidden');
  els.detail.classList.add('visible');
  window.scrollTo({top:0, behavior:'smooth'});
}

function closeDetail(){
  els.detail.classList.remove('visible');
  els.home.classList.remove('hidden');
  currentCardIndex = null;
  currentMenuIndex = null;
  window.scrollTo({top:0, behavior:'smooth'});
}

function setLang(lang){
  currentLang = lang;
  renderHome();
  if(currentCardIndex !== null || currentMenuIndex !== null) renderDetail();
  updateGiveTexts();
  if(giveState.step) setGiveStep(giveState.step);
  els.langMenu.classList.remove('open');
  els.langBtn.setAttribute('aria-expanded','false');
  document.querySelectorAll('.lang-option').forEach(opt=>{
    opt.setAttribute('aria-current', opt.dataset.lang === lang ? 'true' : 'false');
  });
}

els.langBtn.addEventListener('click', () => {
  const open = els.langMenu.classList.toggle('open');
  els.langBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
});

document.querySelectorAll('.lang-option').forEach(opt => {
  opt.addEventListener('click', () => setLang(opt.dataset.lang));
});

els.menuBtn.addEventListener('click', () => {
  const open = els.menuDropdown.classList.toggle('open');
  els.menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
});

document.querySelectorAll('.menu-option').forEach(opt => {
  opt.addEventListener('click', () => {
    els.menuDropdown.classList.remove('open');
    els.menuBtn.setAttribute('aria-expanded', 'false');
    openMenuItem(Number(opt.dataset.menu));
  });
});

document.addEventListener('click', (e) => {
  if(!e.target.closest('.lang-wrap')){
    els.langMenu.classList.remove('open');
    els.langBtn.setAttribute('aria-expanded','false');
  }
  if(!e.target.closest('.menu-wrap')){
    els.menuDropdown.classList.remove('open');
    els.menuBtn.setAttribute('aria-expanded','false');
  }
});

els.backBtn.addEventListener('click', closeDetail);

/* ---- Give modal ---- */

const giveState = {
  step: null,
  type: null,
  projectName: '',
  method: null
};

const GIVE_STEP_ORDER = ['type', 'contact', 'payment'];

function updateGiveTexts(){
  const t = translations[currentLang].giveModal;
  els.giveSubtitleType.textContent = t.subtitleType;
  els.giveTypeDonations.textContent = t.typeDonations;
  els.giveTypeTithe.textContent = t.typeTithe;
  els.giveTypeSeed.textContent = t.typeSeed;
  els.giveTypeProject.textContent = t.typeProject;
  els.lblProject.textContent = t.projectLabel;
  els.projectNameInput.placeholder = t.projectPlaceholder;
  els.typeContinueBtn.textContent = t.continueBtn;

  els.contactHeading.textContent = t.contactTitle;
  els.lblFirst.textContent = t.firstName;
  els.lblLast.textContent = t.lastName;
  els.lblContact.textContent = t.contactField;
  els.contactInput.placeholder = t.contactPlaceholder;
  els.lblAmount.textContent = t.amount;
  els.amountInput.placeholder = t.amountPlaceholder;
  els.contactError.textContent = t.required;
  els.contactContinueBtn.textContent = t.continueBtn;

  els.paymentHeading.textContent = t.paymentTitle;
  els.paymentBtnPaypal.textContent = t.methodPaypal;
  els.paymentBtnCredit.textContent = t.methodCredit;
  els.paymentBtnDebit.textContent = t.methodDebit;
  els.paymentBtnApple.textContent = t.methodApple;
  els.paymentBtnGoogle.textContent = t.methodGoogle;
  els.lblCardNumber.textContent = t.cardNumber;
  els.lblCardExpiry.textContent = t.cardExpiry;
  els.lblCardCvv.textContent = t.cardCvv;
  els.payCompleteBtn.textContent = t.completeBtn;

  els.processingText.textContent = t.processing;
  els.doneBtn.textContent = t.doneBtn;
}

function giveModalTitleForStep(step){
  const t = translations[currentLang].giveModal;
  if(step === 'contact') return t.contactTitle;
  if(step === 'payment') return t.paymentTitle;
  if(step === 'success') return t.successTitle;
  return t.title;
}

function setGiveStep(step){
  giveState.step = step;
  els.giveModalTitle.textContent = giveModalTitleForStep(step);
  const canGoBack = step === 'contact' || step === 'payment';
  els.giveBackBtn.classList.toggle('invisible', !canGoBack);

  const stepMap = {
    type: els.stepType,
    contact: els.stepContact,
    payment: els.stepPayment,
    processing: els.stepProcessing,
    success: els.stepSuccess
  };
  Object.entries(stepMap).forEach(([key, el]) => { el.hidden = key !== step; });
}

function resetGiveState(){
  giveState.step = null;
  giveState.type = null;
  giveState.projectName = '';
  giveState.method = null;

  document.querySelectorAll('.give-type-btn').forEach(b => b.classList.remove('selected'));
  document.querySelectorAll('.payment-btn').forEach(b => b.classList.remove('selected'));
  els.projectField.hidden = true;
  els.projectNameInput.value = '';
  els.typeContinueBtn.disabled = true;

  els.firstNameInput.value = '';
  els.lastNameInput.value = '';
  els.contactInput.value = '';
  els.amountInput.value = '';
  els.contactError.hidden = true;

  els.cardFields.hidden = true;
  els.cardNumberInput.value = '';
  els.cardExpiryInput.value = '';
  els.cardCvvInput.value = '';
  els.payCompleteBtn.disabled = true;
}

function updateTypeContinueState(){
  const hasType = !!giveState.type;
  const projectOk = giveState.type !== 'project' || els.projectNameInput.value.trim().length > 0;
  els.typeContinueBtn.disabled = !(hasType && projectOk);
}

function openGiveModal(){
  updateGiveTexts();
  resetGiveState();
  setGiveStep('type');
  els.giveOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeGiveModal(){
  els.giveOverlay.classList.remove('open');
  document.body.style.overflow = '';
}

els.giveBtn.addEventListener('click', openGiveModal);
els.giveCloseBtn.addEventListener('click', closeGiveModal);
els.giveOverlay.addEventListener('click', (e) => {
  if(e.target === els.giveOverlay) closeGiveModal();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && els.giveOverlay.classList.contains('open')) closeGiveModal();
});

els.giveBackBtn.addEventListener('click', () => {
  const idx = GIVE_STEP_ORDER.indexOf(giveState.step);
  if(idx > 0) setGiveStep(GIVE_STEP_ORDER[idx - 1]);
});

document.querySelectorAll('.give-type-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    giveState.type = btn.dataset.type;
    document.querySelectorAll('.give-type-btn').forEach(b => b.classList.toggle('selected', b === btn));
    els.projectField.hidden = giveState.type !== 'project';
    updateTypeContinueState();
  });
});

els.projectNameInput.addEventListener('input', () => {
  giveState.projectName = els.projectNameInput.value;
  updateTypeContinueState();
});

els.typeContinueBtn.addEventListener('click', () => {
  if(els.typeContinueBtn.disabled) return;
  setGiveStep('contact');
});

els.contactContinueBtn.addEventListener('click', () => {
  const valid = els.firstNameInput.value.trim() &&
    els.lastNameInput.value.trim() &&
    els.contactInput.value.trim() &&
    els.amountInput.value && Number(els.amountInput.value) > 0;
  els.contactError.hidden = !!valid;
  if(!valid) return;
  setGiveStep('payment');
});

document.querySelectorAll('.payment-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    giveState.method = btn.dataset.method;
    document.querySelectorAll('.payment-btn').forEach(b => b.classList.toggle('selected', b === btn));
    const needsCard = giveState.method === 'credit' || giveState.method === 'debit';
    els.cardFields.hidden = !needsCard;
    els.payCompleteBtn.disabled = false;
  });
});

els.payCompleteBtn.addEventListener('click', () => {
  if(els.payCompleteBtn.disabled) return;
  const needsCard = giveState.method === 'credit' || giveState.method === 'debit';
  if(needsCard){
    const cardValid = els.cardNumberInput.value.trim() &&
      els.cardExpiryInput.value.trim() &&
      els.cardCvvInput.value.trim();
    if(!cardValid) return;
  }

  setGiveStep('processing');
  setTimeout(() => {
    const t = translations[currentLang].giveModal;
    els.successTitle.textContent = t.successTitle;
    els.successText.textContent = t.successText.replace('{contact}', els.contactInput.value.trim());
    setGiveStep('success');
  }, 1400);
});

els.doneBtn.addEventListener('click', closeGiveModal);

els.dQuizBtn.addEventListener('click', openQuiz);
els.quizCloseBtn.addEventListener('click', closeQuiz);
els.quizOverlay.addEventListener('click', (e) => {
  if(e.target === els.quizOverlay) closeQuiz();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && els.quizOverlay.classList.contains('open')) closeQuiz();
});

renderHome();
</script>
</body>
</html>
